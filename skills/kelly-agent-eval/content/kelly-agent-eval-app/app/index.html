<!doctype html>
<html lang="en" data-theme="ink-paper" data-editorial="desk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Agent Eval & Regression Board</title>
    <link rel="stylesheet" href="./base-ui.css">
    <link rel="stylesheet" href="./styles/editorial.css" />
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./vendor/busabase-airapp-gate.css">
    <link rel="stylesheet" href="./accent-theme.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="sidebar" id="appSidebar">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">E</div>
          <div class="brand-copy">
            <div class="brand-title">Agent Eval Board</div>
            <div id="sync-status" class="brand-subtitle">Loading</div>
          </div>
          <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-controls="appSidebar" aria-expanded="true" title="Toggle sidebar" aria-label="Toggle sidebar"><span class="sidebar-toggle-icon" aria-hidden="true"></span></button>
        </div>
        <section class="human-work" aria-labelledby="humanWorkTitle">
          <div class="human-work-eyebrow" data-i18n="attention">Regressions</div>
          <div id="humanWorkTitle" class="human-work-title" data-i18n="humanWorkTitle">Regressions at a glance</div>
          <a class="human-work-primary" href="#/regressions?status=needs_review" data-route="regressions" title="Open the regression review queue">
            <span>
              <strong id="pending-review-figure">0</strong>
              <span data-i18n="needDecision">need a decision</span>
            </span>
          </a>
          <div class="human-work-secondary">
            <a href="#/regressions?status=blocking" data-route="regressions">
              <strong id="count-blocking">0</strong>
              <span data-i18n="blocking">blocking</span>
            </a>
            <a href="#/overview" data-route="overview">
              <strong id="count-release">—</strong>
              <span data-i18n="release">release</span>
            </a>
          </div>
        </section>
        <div class="sidebar-separator"></div>
        <nav class="filters" aria-label="Main">
          <a href="#/overview" data-route="overview" data-i18n="overview">Overview</a>
          <a href="#/regressions" data-route="regressions" data-i18n="regressionsTitle">Regressions</a>
          <a href="#/cases" data-route="cases" data-i18n="casesTitle">All Cases</a>
          <a href="#/settings" data-route="settings" data-i18n="settings">Help & Settings</a>
        </nav>
        <div class="sidebar-footer">
          <label for="language" data-i18n="language">Language</label>
          <select id="language">
            <option value="auto">Auto</option>
            <option value="en">English</option>
            <option value="zh">中文</option>
          </select>
        </div>
      </aside>
      <main class="main">
        <div class="mobile-topbar">
          <button id="mobileSidebarToggle" class="mobile-sidebar-toggle" type="button" aria-controls="appSidebar" aria-label="Open sidebar" title="Open sidebar"><span class="sidebar-toggle-icon" aria-hidden="true"></span></button>
          <div class="mobile-topbar-copy">
            <div id="mobileViewTitle" class="mobile-view-title">Agent Eval Board</div>
            <div id="mobileViewMeta" class="mobile-view-meta">Loading</div>
          </div>
          <button id="mobileRefresh" class="mobile-refresh-button" type="button" title="Refresh" aria-label="Refresh">↻</button>
        </div>
        <div id="loadState" class="load-state" role="status">Loading</div>
        <div id="lockBanner" class="warnings" hidden></div>
        <!-- Overview is the only page with a hero and a metrics band. -->
        <section id="overviewPage" class="ws-overview" hidden>
          <header class="page-hero">
            <div>
              <h1 id="overviewTitle" data-i18n="overview">Overview</h1>
              <p id="overviewSummary" class="muted"></p>
            </div>
            <div class="page-actions">
              <button id="refresh" class="button" type="button" title="Refresh" aria-label="Refresh" data-i18n="refresh">Refresh</button>
            </div>
          </header>
          <div id="overviewMetrics" class="ws-metrics" aria-label="Eval run summary"></div>
          <div id="overviewBody"></div>
        </section>
        <!-- Record views: one toolbar row over a full-bleed table. -->
        <section id="viewPage" class="ws-view" hidden>
          <header class="ws-toolbar">
            <div class="ws-title">
              <h1 id="viewTitle"></h1>
              <span id="viewCount" class="ws-count"></span>
            </div>
            <div class="ws-actions">
              <div id="viewFilters" hidden></div>
              <label class="search toolbar-search">
                <span class="sr-only" data-i18n="search">Search</span>
                <input id="search" type="search" autocomplete="off" placeholder="Search">
              </label>
            </div>
          </header>
          <div id="workspace" class="ws-workspace">
            <div id="listPanel" class="ws-list"></div>
            <aside id="detailPanel" class="ws-detail" aria-live="polite">
              <div class="ws-detail-bar">
                <button id="detailBack" class="button" type="button" data-i18n="backToList">Back to list</button>
                <a id="detailExpand" class="button" hidden data-i18n="openFullPage">Open full page</a>
              </div>
              <div id="detailBody"></div>
            </aside>
          </div>
        </section>
        <section id="settingsPage" class="ws-view" hidden>
          <header class="ws-toolbar">
            <div class="ws-title"><h1 id="settingsTitle" data-i18n="settings">Help & Settings</h1></div>
          </header>
          <div id="settingsContent" class="settings-scroll"></div>
        </section>
      </main>
    </div>
    <div id="sidebarScrim" class="sidebar-scrim" hidden></div>
    <script type="module" src="./app.js"></script>
    <script type="module" src="./accent-theme.js"></script>
  </body>
</html>
