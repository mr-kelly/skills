<!doctype html>
<html lang="en" data-theme="ink-paper" data-editorial="desk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Predictive Recommendation Analytics Desk</title>
    <link rel="stylesheet" href="./base-ui.css">
    <link rel="stylesheet" href="./styles/editorial.css" />
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./vendor/busabase-airapp-gate.css">
    <link rel="stylesheet" href="./accent-theme.css" />
  </head>
  <body class="ws-has-mobile-bar">
    <div id="app" class="app-shell">
      <aside class="sidebar" id="appSidebar">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">P</div>
          <div class="brand-copy">
            <div class="brand-title">Analytics Desk</div>
            <div id="sync-status" class="brand-subtitle">Loading</div>
          </div>
          <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-controls="appSidebar" aria-expanded="true" title="Toggle sidebar" aria-label="Toggle sidebar"><span class="sidebar-toggle-icon" aria-hidden="true"></span></button>
        </div>
        <section class="human-work" aria-labelledby="humanWorkTitle">
          <div class="human-work-eyebrow" data-i18n="attention">Analytics</div>
          <div id="humanWorkTitle" class="human-work-title" data-i18n="humanWorkTitle">Funnel at a glance</div>
          <a class="human-work-primary" href="#/backtest" data-route="backtest">
            <span>
              <strong id="accuracy-figure">—</strong>
              <span>
                <span id="summary-accuracy" class="human-work-figure">—</span>
                <span data-i18n="overallAccuracy">overall accuracy</span>
              </span>
            </span>
          </a>
          <div class="human-work-secondary">
            <a href="#/segments" data-route="segments">
              <strong id="count-needs-decision">0</strong>
              <span data-i18n="needsDecision">need a decision</span>
            </a>
            <a href="#/segments" data-route="segments">
              <strong id="count-segments">0</strong>
              <span data-i18n="segmentCount">segments</span>
            </a>
          </div>
        </section>
        <div class="sidebar-separator"></div>
        <nav class="filters" aria-label="Main">
          <a href="#/overview" data-route="overview" data-i18n="overview">Overview</a>
          <a href="#/segments" data-route="segments" data-i18n="segmentsTitle">Segments</a>
          <a href="#/backtest" data-route="backtest" data-i18n="backtestTitle">Backtest</a>
          <a href="#/settings" data-route="settings" data-i18n="settings">Help & Settings</a>
        </nav>
        <div class="sidebar-footer">
          <label for="language" data-i18n="language">Language</label>
          <select id="language">
            <option value="auto">Auto</option>
            <option value="en">English</option>
            <option value="zh">中文</option>
          </select>
        </div>
      </aside>
      <main class="main">
        <div class="mobile-topbar">
          <button id="mobileSidebarToggle" class="mobile-sidebar-toggle" type="button" aria-controls="appSidebar" aria-label="Open sidebar" title="Open sidebar"><span class="sidebar-toggle-icon" aria-hidden="true"></span></button>
          <div class="mobile-topbar-copy">
            <div id="mobileViewTitle" class="mobile-view-title">Analytics Desk</div>
            <div id="mobileViewMeta" class="mobile-view-meta">Loading</div>
          </div>
          <button id="mobileRefresh" class="mobile-refresh-button" type="button" title="Refresh" aria-label="Refresh">↻</button>
        </div>
        <div id="loadState" class="load-state" role="status">Loading</div>
        <!-- Overview is the only page with a hero and a metrics band. -->
        <section id="overviewPage" class="ws-overview" hidden>
          <header class="page-hero">
            <div>
              <h1 id="overviewTitle">Overview</h1>
              <p id="overviewSummary" class="muted"></p>
            </div>
            <div class="page-actions">
              <button id="refresh" class="button" type="button" title="Refresh">Refresh</button>
            </div>
          </header>
          <div id="overviewMetrics" class="ws-metrics" aria-label="Funnel summary"></div>
          <div id="overviewBody"></div>
        </section>
        <!-- Record view: one toolbar row over a full-bleed table. The only
             Base with its own browsable list is Segments. -->
        <section id="segmentsPage" class="ws-view" hidden>
          <header class="ws-toolbar">
            <div class="ws-title">
              <h1 id="segmentsViewTitle" title="">Segments</h1>
              <span id="segmentsCount" class="ws-count"></span>
            </div>
            <div class="ws-actions">
              <label class="search toolbar-search">
                <span class="sr-only" data-i18n="search">Search</span>
                <input id="search" type="search" autocomplete="off" placeholder="Search">
              </label>
            </div>
          </header>
          <div class="ws-workspace">
            <div id="segmentsList" class="ws-list"></div>
            <aside id="segmentsDetail" class="ws-detail" aria-live="polite">
              <div class="ws-detail-bar">
                <button id="detailBack" class="button" type="button">Back</button>
                <a id="detailExpand" class="button" hidden>Open full page</a>
              </div>
              <div id="segmentsDetailBody"></div>
            </aside>
          </div>
        </section>
        <!-- Backtest is a cross-segment report, not a selectable record list:
             one toolbar row, then a scrollable report body. -->
        <section id="backtestPage" class="ws-view" hidden>
          <header class="ws-toolbar">
            <div class="ws-title"><h1 id="backtestViewTitle">Backtest</h1></div>
          </header>
          <div id="backtestBody" class="ws-report-body"></div>
        </section>
        <section id="settingsPage" class="ws-view" hidden>
          <header class="ws-toolbar">
            <div class="ws-title"><h1 id="settingsTitle">Help & Settings</h1></div>
          </header>
          <div id="settingsBody" class="ws-report-body"></div>
        </section>
      </main>
    </div>
    <div id="sidebarScrim" class="sidebar-scrim" hidden></div>
    <script type="module" src="./app.js"></script>
    <script type="module" src="./accent-theme.js"></script>
  </body>
</html>
