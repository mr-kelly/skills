<!doctype html>
<html lang="en" data-theme="ink-paper" data-editorial="desk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Kelly Education Intel</title>
    <link rel="stylesheet" href="./base-ui.css">
    <link rel="stylesheet" href="./styles/editorial.css" />
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./vendor/busabase-airapp-gate.css">
    <link rel="stylesheet" href="./accent-theme.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="sidebar" id="appSidebar">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">学</div>
          <div class="brand-copy">
            <div class="brand-title">Kelly Education Intel</div>
            <div id="sync-status" class="brand-subtitle">Loading</div>
          </div>
          <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-controls="appSidebar" aria-expanded="true" title="Toggle sidebar" aria-label="Toggle sidebar"><span class="sidebar-toggle-icon" aria-hidden="true"></span></button>
        </div>
        <section class="human-work" aria-labelledby="humanWorkTitle">
          <div class="human-work-eyebrow" data-i18n="attention">Today's batch</div>
          <div id="humanWorkTitle" class="human-work-title" data-i18n="humanWorkTitle">What needs your attention</div>
          <a class="human-work-primary" href="#/overview" data-route="overview">
            <span>
              <strong id="count-needs-review">0</strong>
              <span data-i18n="needsReview">needs review</span>
            </span>
          </a>
          <div class="human-work-secondary">
            <a href="#/signals" data-route="signals">
              <strong id="count-approved">0</strong>
              <span data-i18n="approvedCount">approved</span>
            </a>
            <a href="#/signals" data-route="signals">
              <strong id="count-blocked">0</strong>
              <span data-i18n="blockedCount">blocked/changes requested</span>
            </a>
          </div>
        </section>
        <div class="sidebar-separator"></div>
        <nav class="filters" aria-label="Main">
          <a href="#/overview" data-route="overview" data-i18n="overview">Overview</a>
          <a href="#/signals" data-route="signals" data-i18n="signals">Signals</a>
          <a href="#/actions" data-route="actions" data-i18n="actions">Actions</a>
          <a href="#/drafts" data-route="drafts" data-i18n="drafts">Drafts</a>
          <a href="#/sources" data-route="sources" data-i18n="sources">Sources</a>
          <a href="#/settings" data-route="settings" data-i18n="settings">Help &amp; Settings</a>
        </nav>
        <div class="sidebar-footer">
          <label for="language" data-i18n="language">Language</label>
          <select id="language">
            <option value="auto">Auto</option>
            <option value="en">English</option>
            <option value="zh">中文</option>
          </select>
        </div>
      </aside>
      <main class="main">
        <div class="mobile-topbar">
          <button id="mobileSidebarToggle" class="mobile-sidebar-toggle" type="button" aria-controls="appSidebar" aria-label="Open sidebar" title="Open sidebar"><span class="sidebar-toggle-icon" aria-hidden="true"></span></button>
          <div class="mobile-topbar-copy">
            <div id="mobileViewTitle" class="mobile-view-title">Kelly Education Intel</div>
            <div id="mobileViewMeta" class="mobile-view-meta">Loading</div>
          </div>
          <button id="mobileRefresh" class="mobile-refresh-button" type="button" title="Refresh" aria-label="Refresh">↻</button>
        </div>
        <div id="loadState" class="load-state" role="status">Loading</div>
        <!-- Overview is the only page with the hero and a ≤3-number metrics band. -->
        <section id="overviewPage" class="ws-overview" hidden>
          <header class="page-hero">
            <div>
              <h1 id="overviewTitle">Overview</h1>
              <p id="overviewSummary" class="muted"></p>
            </div>
            <div class="topbar-actions">
              <button id="refresh" type="button" title="Refresh" aria-label="Refresh">Refresh</button>
            </div>
          </header>
          <div id="overviewMetrics" class="ws-metrics" aria-label="Today's batch summary"></div>
          <div id="overviewBody"></div>
        </section>
        <!-- Signals/Actions/Drafts: one toolbar row over a full-bleed table. -->
        <section id="recordPage" class="ws-view" hidden>
          <header class="ws-toolbar">
            <div class="ws-title">
              <h1 id="viewTitle"></h1>
              <span id="viewCount" class="ws-count"></span>
            </div>
            <div class="ws-actions">
              <label class="search toolbar-search">
                <span class="sr-only" data-i18n="search">Search</span>
                <input id="search" type="search" autocomplete="off" placeholder="Search">
              </label>
              <button id="viewRefresh" type="button" title="Refresh" aria-label="Refresh">Refresh</button>
            </div>
          </header>
          <div class="ws-workspace">
            <div id="listPanel" class="ws-list"></div>
            <aside id="detailPanel" class="ws-detail" aria-live="polite">
              <div class="ws-detail-bar" hidden>
                <button id="detailBack" type="button">Close</button>
                <a id="detailExpand" type="button" hidden>Open full page</a>
              </div>
              <div id="detailBody"></div>
            </aside>
          </div>
        </section>
        <!-- Sources: a read-only configuration table, no per-row decision. -->
        <section id="sourcesPage" class="ws-view" hidden>
          <header class="ws-toolbar">
            <div class="ws-title">
              <h1 id="sourcesTitle" data-i18n="sources">Sources</h1>
              <span id="sourcesCount" class="ws-count"></span>
            </div>
          </header>
          <div class="ws-workspace">
            <div id="sourcesList" class="ws-list"></div>
          </div>
        </section>
        <section id="settingsPage" class="ws-view" hidden>
          <header class="ws-toolbar">
            <div class="ws-title"><h1 id="settingsTitle" data-i18n="settings">Help &amp; Settings</h1></div>
          </header>
          <div id="settingsContent" class="settings-scroll"></div>
        </section>
      </main>
    </div>
    <div id="sidebarScrim" class="sidebar-scrim" hidden></div>
    <script type="module" src="./app.js"></script>
    <script type="module" src="./accent-theme.js"></script>
  </body>
</html>
