<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Kelly PMO</title>
    <link rel="stylesheet" href="./base-ui.css">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./demo-visuals.css">
    <link rel="stylesheet" href="./vendor/busabase-airapp-gate.css">
    <link rel="stylesheet" href="./accent-theme.css">
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="sidebar" id="appSidebar">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">PM</div>
          <div class="brand-copy"><div class="brand-title">Kelly PMO</div><div id="sync" class="brand-subtitle">Loading</div></div>
          <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-controls="appSidebar" aria-expanded="true" title="Toggle sidebar" aria-label="Toggle sidebar"><span class="sidebar-toggle-icon" aria-hidden="true"></span></button>
        </div>
        <div class="search sidebar-search"><input id="search" type="search" placeholder="Search" aria-label="Search"></div>
        <section class="human-work" aria-labelledby="humanWorkTitle">
          <div class="human-work-eyebrow" data-i18n="humanAttention">Needs attention</div>
          <div id="humanWorkTitle" class="human-work-title" data-i18n="humanWorkTitle">Move the portfolio forward</div>
          <a class="human-work-primary" href="#/decisions" data-route="decisions" title="Open decisions"><span><strong id="countDecisions">0</strong><span data-i18n="needDecisionCount">decisions need you</span></span></a>
          <div class="human-work-secondary">
            <a href="#/reports" data-route="reports" title="Open reports"><strong id="countReports">0</strong><span data-i18n="lateReports">late reports</span></a>
            <a href="#/risks" data-route="risks" title="Open risks"><strong id="countRisk">0</strong><span data-i18n="highRisks">high risks</span></a>
          </div>
        </section>
        <div class="sidebar-separator"></div>
        <nav class="filters" aria-label="Main">
          <a href="#/overview" data-route="overview" data-i18n="overview" title="Overview">Overview</a>
          <a href="#/projects" data-route="projects" data-i18n="projects" title="Projects">Projects</a>
          <a href="#/milestones" data-route="milestones" data-i18n="milestones" title="Milestones">Milestones</a>
          <a href="#/risks" data-route="risks" data-i18n="risks" title="Risks">Risks</a>
          <a href="#/reports" data-route="reports" data-i18n="reports" title="Reports">Reports</a>
          <a href="#/decisions" data-route="decisions" data-i18n="decisions" title="Decisions">Decisions</a>
          <a href="#/workspace" data-route="workspace" data-i18n="workspace" title="Data workspace">Data workspace</a>
        </nav>
        <div class="sidebar-footer">
          <a class="settings-link" href="#/settings" data-route="settings" data-i18n="settings" title="Help & Settings">Help & Settings</a>
          <label for="language" data-i18n="language">Language</label>
          <select id="language"><option value="auto">Auto</option><option value="en">English</option><option value="zh">中文</option></select>
        </div>
      </aside>
      <main class="main">
        <div class="mobile-topbar">
          <button id="mobileSidebarToggle" class="mobile-sidebar-toggle" type="button" aria-controls="appSidebar" aria-label="Open sidebar" title="Open sidebar"><span class="sidebar-toggle-icon" aria-hidden="true"></span></button>
          <div class="mobile-topbar-copy"><div id="mobileViewTitle" class="mobile-view-title">Kelly PMO</div><div id="mobileViewMeta" class="mobile-view-meta">Loading</div></div>
          <button id="mobileRefresh" class="mobile-refresh-button" type="button" title="Refresh" aria-label="Refresh">↻</button>
        </div>
        <header class="topbar">
          <div><h1 id="title">Overview</h1><p id="subtitle"></p></div>
          <div class="topbar-actions"><button id="newProjectBtn" type="button" title="New project">New project</button><button id="refresh" class="ghost" type="button" data-i18n="refresh" title="Refresh">Refresh</button></div>
        </header>
        <section id="content" class="content"></section>
      </main>
    </div>
    <div id="sidebarScrim" class="sidebar-scrim" hidden></div>
    <div id="settingsModal" class="modal-backdrop" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <header class="modal-header"><div><span class="eyebrow" data-i18n="settings">Help & Settings</span><h2 id="settingsTitle">Kelly PMO</h2></div><button id="settingsClose" class="icon-button" type="button" aria-label="Close" title="Close">×</button></header>
        <div class="modal-tabs"><span data-i18n="guide">Guide</span><span data-i18n="resources">Resources</span></div>
        <div id="settingsBody" class="modal-body"></div>
      </section>
    </div>
    <script src="./demo-visuals.js"></script>
    <script type="module" src="./app.js"></script>
    <script type="module" src="./accent-theme.js"></script>
  </body>
</html>
