interface:
  display_name: "Kelly Drama"
  short_description: "Drama planning UI with HyperFrame-linked episode production."
  default_prompt: "Use kelly-drama to plan a serialized drama or product-video project in stages: establish characters and relationships, lock approved three-view character turnarounds, write scene-specific connected shots with dialogue/SRT and carry-over continuity, confirm the text, then generate and approve storyboard images before generating video, using local MiniMax-H3 MLX when configured and linking each episode to HyperFrame for final tuning."
