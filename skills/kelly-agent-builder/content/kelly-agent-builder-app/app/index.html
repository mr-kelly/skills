<!doctype html>
<html lang="en" data-theme="ink-paper" data-editorial="desk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Agent Builder & Governance Console</title>
    <link rel="stylesheet" href="./base-ui.css">
    <link rel="stylesheet" href="./styles/editorial.css" />
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./vendor/busabase-airapp-gate.css">
    <link rel="stylesheet" href="./accent-theme.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="sidebar" id="appSidebar">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">A</div>
          <div class="brand-copy">
            <div class="brand-title">Agent Builder</div>
            <div id="sync-status" class="brand-subtitle">Loading</div>
          </div>
          <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-controls="appSidebar" aria-expanded="true" title="Toggle sidebar" aria-label="Toggle sidebar"><span class="sidebar-toggle-icon" aria-hidden="true"></span></button>
        </div>
        <div class="search sidebar-search">
          <input id="search" type="search" placeholder="Search" aria-label="Search">
        </div>
        <section class="human-work" aria-labelledby="humanWorkTitle">
          <div class="human-work-eyebrow" data-i18n="attention">Governance</div>
          <div id="humanWorkTitle" class="human-work-title" data-i18n="humanWorkTitle">Governance at a glance</div>
          <a class="human-work-primary" href="#/overview" data-route="overview">
            <span>
              <strong id="attention-count">0</strong>
              <span data-i18n="needsAttention">needs attention</span>
            </span>
          </a>
          <div class="human-work-secondary">
            <a href="#/catalog" data-route="catalog">
              <strong id="count-live">0</strong>
              <span data-i18n="liveAgents">live agents</span>
            </a>
            <a href="#/catalog" data-route="catalog">
              <strong id="count-total">0</strong>
              <span data-i18n="totalAgents">agents</span>
            </a>
          </div>
        </section>
        <div class="sidebar-separator"></div>
        <nav class="filters" aria-label="Main">
          <a href="#/overview" data-route="overview" data-i18n="overview">Overview</a>
          <a href="#/catalog" data-route="catalog" data-i18n="catalogTitle">Agent Catalog</a>
          <a href="#/settings" data-route="settings" data-i18n="settings">Help & Settings</a>
        </nav>
        <div class="sidebar-footer">
          <label for="language" data-i18n="language">Language</label>
          <select id="language">
            <option value="auto">Auto</option>
            <option value="en">English</option>
            <option value="zh">中文</option>
          </select>
        </div>
      </aside>
      <main class="main">
        <div class="mobile-topbar">
          <button id="mobileSidebarToggle" class="mobile-sidebar-toggle" type="button" aria-controls="appSidebar" aria-label="Open sidebar" title="Open sidebar"><span class="sidebar-toggle-icon" aria-hidden="true"></span></button>
          <div class="mobile-topbar-copy">
            <div id="mobileViewTitle" class="mobile-view-title">Agent Builder</div>
            <div id="mobileViewMeta" class="mobile-view-meta">Loading</div>
          </div>
          <button id="mobileRefresh" class="mobile-refresh-button" type="button" title="Refresh" aria-label="Refresh">↻</button>
        </div>
        <div id="loadState" class="load-state" role="status">Loading</div>
        <!-- Overview: the only page with a hero and a ≤3-number metrics band. -->
        <section id="overviewPage" class="ws-overview" hidden>
          <header class="page-hero">
            <div>
              <h1 id="overviewTitle">Overview</h1>
              <p id="overviewSummary" class="muted"></p>
            </div>
            <div class="page-actions">
              <button id="refresh" class="button" type="button" title="Refresh" data-i18n="refresh">Refresh</button>
            </div>
          </header>
          <div id="overviewMetrics" class="ws-metrics" aria-label="Governance summary"></div>
          <div id="overviewBody"></div>
        </section>
        <!-- Agent catalog: one toolbar row over a full-bleed table. Detail mode
             is "page" (see js/config.js ui.detail_modes) — opening an agent
             replaces the list, it does not drawer/split over it. -->
        <section id="catalogPage" class="ws-view" hidden>
          <header class="ws-toolbar">
            <div class="ws-title">
              <h1 id="viewTitle" data-i18n="catalogTitle">Agent Catalog</h1>
              <span id="viewCount" class="ws-count"></span>
            </div>
            <div class="ws-actions">
              <button id="newAgentButton" class="button primary" type="button" data-i18n="newAgent">New agent</button>
            </div>
          </header>
          <div class="ws-workspace">
            <div id="listPanel" class="ws-list"></div>
            <section id="detailPanel" class="ws-detail" aria-live="polite">
              <div class="ws-detail-bar">
                <a id="detailBack" class="button" href="#/catalog" data-i18n="back">Back</a>
              </div>
              <div id="detailBody"></div>
            </section>
          </div>
        </section>
        <section id="settingsPage" class="ws-view" hidden>
          <header class="ws-toolbar">
            <div class="ws-title"><h1 id="settingsTitle" data-i18n="settings">Help & Settings</h1></div>
          </header>
          <div id="settingsBody" class="settings-scroll"></div>
        </section>
      </main>
    </div>
    <div id="sidebarScrim" class="sidebar-scrim" hidden></div>
    <script type="module" src="./app.js"></script>
    <script type="module" src="./accent-theme.js"></script>
  </body>
</html>
